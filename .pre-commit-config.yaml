# Install once per clone:  pip install pre-commit  &&  pre-commit install
# Run on everything:        pre-commit run --all-files
# ESLint and Prettier hooks are added with the frontends (R7).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  # Both backends. Ruff reads the nearest pyproject.toml, so each backend keeps its own
  # rules; the version matches requirements-dev.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        files: ^(professional|partner)/backend/
      - id: ruff-format
        files: ^(professional|partner)/backend/
