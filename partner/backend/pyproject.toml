# Tool settings for the Partner API. Dependencies live in requirements.txt and
# requirements-dev.txt (pinned); this file is not used to build a package.

[project]
name = "crewnbuild-partner-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports and variables
    "I",        # import order
    "B",        # bugbear
    "UP",       # modern Python syntax
    "N",        # naming
    "S",        # security (bandit)
    "SIM",      # simplifications
    "T20",      # no print() debugging
    "ERA",      # no commented-out code
    "C4",       # comprehensions
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the intended pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and fixture secrets are fine in tests
# Ported from the old Partner app unchanged (long lines, the old error handling and
# naming); restyle when each module is next changed.
"app/modules/{bookings,catalog,locations,realtime,technicians,tracking,weather}/*.py" = ["E501", "B904", "N818", "RUF001", "RUF002", "RUF003", "UP046", "SIM102", "SIM108", "C408", "C416", "B023", "S311"]
"app/database/base_repository.py" = ["UP046"]
"app/seeds/*.py" = ["E501", "T201", "B904"]
"app/scripts/*.py" = ["E501", "T201", "B904"]
"tests/{onboarding,technicians,bookings,tracking,weather,realtime}/*.py" = ["E501", "S101", "S105", "S106", "N802", "N806", "RUF001", "RUF003", "S311", "B023", "SIM117", "PT011", "C408"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
