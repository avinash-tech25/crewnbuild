# Alembic for the Professional API: schema professional only, version table
# professional.alembic_version (technical-architecture.md 16.2, MG-02).
# The database address comes from DATABASE_URL (app/core/config.py), never from this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Readable migration file names: 20261114_0001_initial_professional_schema.py (MG-05).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
