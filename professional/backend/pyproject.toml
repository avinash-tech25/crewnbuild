# Tool settings for the Professional API. Dependencies live in requirements.txt and
# requirements-dev.txt (pinned); this file is not used to build a package.

[project]
name = "crewnbuild-professional-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports and variables
    "I",        # import order
    "B",        # bugbear
    "UP",       # modern Python syntax
    "N",        # naming
    "S",        # security (bandit)
    "SIM",      # simplifications
    "T20",      # no print() debugging
    "ERA",      # no commented-out code
    "C4",       # comprehensions
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the intended pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and fixture secrets are fine in tests
# The model prompt is text sent to the provider word for word; it is not wrapped.
"app/modules/content/translation_service.py" = ["E501"]
# Ported from the old app/weather unchanged; restyle when the module is next changed.
"app/modules/weather/*.py" = ["E501", "RUF001", "RUF005", "C408", "C416", "SIM102", "B023", "N818"]
# Ported from the old project services unchanged (long lines, the old error handling).
"app/modules/projects/*_service.py" = ["E501", "RUF001", "RUF005", "B904", "B905", "SIM105", "S110", "S311"]
"app/modules/projects/*_repository.py" = ["E501"]
"app/modules/site_operations/service.py" = ["E501", "RUF005", "RUF046", "B904", "B905", "SIM105", "S110"]
"app/modules/site_operations/repository.py" = ["E501"]
"app/modules/store/*_service.py" = ["E501", "RUF001", "RUF036", "B904", "B905"]
# Ported from the old app/shared/cctv unchanged (long lines; token-type and digest-scheme
# names are not passwords; the old exception name and the probe loop that skips a dead port).
"app/modules/cctv/**/*.py" = ["E501", "S105", "N818", "S112"]
# Ported from the old app/subscription and app/payment_gateway unchanged (long lines, the
# old error handling).
"app/modules/billing/*_service.py" = ["E501", "B904"]
"app/modules/billing/*_admin.py" = ["E501", "B904"]
"app/modules/billing/booking_payment_*.py" = ["E501", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
