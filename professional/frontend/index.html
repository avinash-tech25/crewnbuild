<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/crew and build logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app has its own language switcher (seven languages). Browser
         auto-translation (Edge / Chrome "Translate this page") rewrites the
         page's text behind React and crashes it with "Failed to execute
         'insertBefore' / 'removeChild' on 'Node'" -- a blank page when a
         pop-up such as Unassign opens. These tell browsers not to translate. -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="CREWNBUILD — Premium construction & engineering. Design, build, renovate and deliver residential, commercial and infrastructure projects with absolute trust."
    />
    <title>CREWNBUILD — Build Anything. Trust Everything.</title>
    <!-- The saved theme, before first paint (a file, not inline, for a strict CSP: FE-09). -->
    <script src="/theme-preference.js"></script>
    <!-- The start-up screen (Crew&Build logo) shown until the app has rendered: its styles,
         the logo it shows, and its timing script, all files for a strict CSP (FE-09). -->
    <link rel="preload" as="image" href="/crew-and-build-logo.png" />
    <link rel="stylesheet" href="/crewnbuild-intro.css" />
    <script src="/crewnbuild-intro-lifecycle.js"></script>
  </head>
  <body>
    <div id="crewnbuild-intro" role="status" aria-live="polite" aria-label="CREWNBUILD. Connecting People. Building Together.">
      <div>
        <div class="crew-intro-art">
          <img class="crew-intro-original" src="/crew-and-build-logo.png" width="654" height="400" alt="CREWNBUILD — Connecting People. Building Together." />
        </div>
        <div class="crew-intro-fallback" hidden><strong>CREWNBUILD</strong><p>Connecting People. Building Together.</p></div>
        <p class="crew-intro-busy">Still loading the application…</p>
        <p class="crew-intro-recovery">The website is taking longer to start. Check your connection or <a href="">reload this page</a>.</p>
      </div>
    </div>
    <div id="root"></div>
    <script async src="/crewnbuild-intro.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
