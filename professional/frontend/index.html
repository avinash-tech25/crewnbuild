<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/crew and build logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app has its own language switcher (seven languages). Browser
         auto-translation (Edge / Chrome "Translate this page") rewrites the
         page's text behind React and crashes it with "Failed to execute
         'insertBefore' / 'removeChild' on 'Node'" -- a blank page when a
         pop-up such as Unassign opens. These tell browsers not to translate. -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="CREWNBUILD — Premium construction & engineering. Design, build, renovate and deliver residential, commercial and infrastructure projects with absolute trust."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CREWNBUILD — Build Anything. Trust Everything.</title>
    <!-- The saved theme, before first paint (a file, not inline, for a strict CSP: FE-09). -->
    <script src="/theme-preference.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
